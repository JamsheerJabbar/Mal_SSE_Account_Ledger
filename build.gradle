plugins {
    id 'java'
    id 'application'
}

group = 'com.mal'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Production code has ZERO third-party dependencies (own JSON codec in com.mal.ledger.io.Json).
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.mal.ledger.runner.Main'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = Boolean.getBoolean('ledger.showOutput')
        exceptionFormat = 'full'
    }
    // Event streams are read from the editable JSON directory, not from resources.
    systemProperty 'ledger.streams.dir', project.hasProperty('streamsDir') ? project.property('streamsDir') : "${projectDir}/event-streams"
    outputs.upToDateWhen { false }
}

tasks.register('generateStreams', JavaExec) {
    group = 'ledger'
    description = 'Regenerate the event-stream JSON files from EventStreamFactory.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mal.ledger.runner.Main'
    args 'generate', "${projectDir}/event-streams"
}

tasks.register('runStreams', JavaExec) {
    group = 'ledger'
    description = 'Run every event stream and print the 6-day report. -Pstream=<id> runs one.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mal.ledger.runner.Main'
    args = project.hasProperty('stream')
            ? ['run', "${projectDir}/event-streams", project.property('stream').toString()]
            : ['run', "${projectDir}/event-streams"]
}
